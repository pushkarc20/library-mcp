[project]
name = "library-mcp"
version = "0.1.0"
description = "Local MCP server over a personal read-it-later library: approval-gated writes, prompt-injection defences and a model eval."
readme = "README.md"
authors = [
    { name = "Pushkar", email = "1435913+pushkar1983@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.12.0",
    "mcp[cli]>=2.3.0",
    "python-dotenv>=1.2.4",
    "supabase>=2.34.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]